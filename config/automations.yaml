- id: '1753217133431'
  alias: Salon Off - Nightly
  description: Turn off TV and climate control when phone is connected to charger
    after 12:30 AM
  triggers:
  - trigger: state
    entity_id:
    - sensor.edo_charger_type
    to:
    - ac
    - usb
    - wireless
  - trigger: state
    entity_id:
    - sensor.edo_battery_state
    to:
    - charging
  conditions:
  - condition: time
    after: 00:00:00
    before: 06:00:00
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  - condition: template
    value_template: "{{ trigger.from_state.state in ['none', 'unknown', 'not_charging',
      'discharging'] \n   or trigger.entity_id == 'sensor.sm_s901e_battery_state'
      }}\n"
  actions:
  - if:
    - condition: state
      entity_id: media_player.samsung_cu7100_65_tv
      state: 'on'
    then:
    - action: remote.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: remote.samsung_cu7100_65_tv_ue65cu7100uxsq
    alias: Turn off tv if on
  - alias: Turn off android streamer if on
    if:
    - condition: state
      entity_id: media_player.partnertv_box_2
      state: 'on'
    then:
    - action: remote.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: remote.partnertv_box
  - alias: מזגן הורים
    if:
    - condition: state
      entity_id: climate.khdr_shynh_hvrym
      state: 'off'
    then:
    - action: climate.turn_on
      metadata: {}
      target:
        entity_id: climate.khdr_shynh_hvrym
      data: {}
    - action: climate.set_temperature
      metadata: {}
      data:
        temperature: 24
      target:
        entity_id: climate.khdr_shynh_hvrym
    - action: climate.set_hvac_mode
      metadata: {}
      data:
        hvac_mode: cool
      target:
        entity_id: climate.khdr_shynh_hvrym
    enabled: false
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.myny_mrkzy_tvrndv
        state: 'off'
    then:
    - action: climate.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: climate.myny_mrkzy_tvrndv
    alias: כיבוי מיני מרכזי
  mode: single
- id: '1757833819795'
  alias: Auto Update All Entities (Daily 3 AM)
  description: Check for updates daily at 3 AM and install them automatically
  triggers:
  - trigger: time
    at: 03:00:00
  conditions: []
  actions:
  - repeat:
      for_each: "{% set update_entities = states.update \n   | selectattr('state',
        'eq', 'on') \n   | selectattr('attributes.auto_update', 'eq', false)\n   |
        selectattr('attributes.supported_features', 'ge', 1)\n   | map(attribute='entity_id')
        \n   | list %}\n{{ update_entities }}"
      sequence:
      - action: update.install
        target:
          entity_id: '{{ repeat.item }}'
      - action: notify.persistent_notification
        data:
          title: Auto Update Complete
          message: '{{ state_attr(repeat.item, ''friendly_name'') }} updated to {{
            state_attr(repeat.item, ''latest_version'') }}'
      - delay:
          seconds: 30
  - condition: template
    value_template: "{% set update_entities = states.update \n   | selectattr('state',
      'eq', 'on') \n   | selectattr('attributes.auto_update', 'eq', false)\n   | selectattr('attributes.supported_features',
      'ge', 1)\n   | map(attribute='entity_id') \n   | list %}\n{{ update_entities
      | length == 0 }}"
  - action: notify.persistent_notification
    data:
      title: Daily Update Check Complete
      message: No updates available at {{ now().strftime('%Y-%m-%d %H:%M') }}
  mode: single
- id: presence_hen_left_work
  alias: Presence - Hen Left Work
  description: Tells Edo's phone when Hen leaves her work zone (at most once per 30 minutes)
  triggers:
  - trigger: zone
    entity_id: person.hen
    zone: zone.khn_bvdh
    event: leave
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}'
  actions:
  - action: notify.mobile_app_sm_s942b
    data:
      title: חן יצאה מהעבודה
      message: >-
        {% set m = states('sensor.waze_hen_to_home') | float(0) | round %}
        {{ 'כ-' ~ m ~ " דק' נסיעה הביתה" if m > 0 else 'בדרך' }}
      data:
        tag: presence_hen
        clickAction: /dashboard-map/hen
  mode: single
- id: presence_hen_near_home
  alias: Presence - Hen Approaching Home
  description: Tells Edo's phone when Hen gets within 2 km of home on her way back (at most once per 30 minutes)
  triggers:
  - trigger: numeric_state
    entity_id: sensor.byt_hen_s_phone_distance
    below: 2000
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.hen
      state: home
  - condition: state
    entity_id: sensor.byt_hen_s_phone_direction_of_travel
    state: towards
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}'
  actions:
  - action: notify.mobile_app_sm_s942b
    data:
      title: חן מתקרבת הביתה
      message: "{{ (states('sensor.byt_hen_s_phone_distance') | float(0) / 1000) | round(1) }} ק\"מ מהבית"
      data:
        tag: presence_hen
        clickAction: /dashboard-map/hen
  mode: single
- id: presence_hen_phone_battery_low
  alias: Presence - Hen Phone Battery Low
  description: Tells Edo's phone when Hen's phone drops below 15% and is not charging
  triggers:
  - trigger: numeric_state
    entity_id: sensor.sm_s918b_battery_level
    below: 15
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.sm_s918b_battery_state
      state:
      - charging
      - full
  actions:
  - action: notify.mobile_app_sm_s942b
    data:
      title: הסוללה של חן נמוכה
      message: "{{ states('sensor.sm_s918b_battery_level') }}% · {{ 'בבית' if is_state('person.hen', 'home') else 'מחוץ לבית' }}"
      data:
        tag: battery_hen
        clickAction: /dashboard-map/hen
  mode: single
