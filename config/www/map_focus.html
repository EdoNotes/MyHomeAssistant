<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מפה</title>
<!-- Focus map dashboard page. Holds no token and no location data: everything is read
     from the Home Assistant frontend that embeds it (dashboard-map, owner only). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#181825;--card:#1e1e2e;--b1:#313244;--b2:#45475a;--b3:#585b70;--tx:#cdd6f4;--mu:#a6adc8;--mu2:#9399b2;
--blue:#89b4fa;--green:#a6e3a1;--pink:#f38ba8;--peach:#fab387;--acc:#0A6FD1;--glass:rgba(24,24,37,.94)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Heebo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
#app{position:relative;height:100%;overflow:hidden}
#app.scroll{overflow-y:auto;overscroll-behavior:contain}
.msg{height:100%;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:var(--mu);font-size:15px;line-height:24px}

/* map */
.map{position:absolute;inset:0;z-index:0;direction:ltr;background:#1f2133;font-family:inherit}
.leaflet-container{background:#1f2133;font-family:inherit}
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) saturate(.5) brightness(.82) contrast(.92)}
.leaflet-control-attribution{background:rgba(24,24,37,.7)!important;color:var(--mu2)!important;font-size:9px!important;padding:0 6px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--mu2)!important}
.pin{width:48px;height:48px;border-radius:50%;background:var(--card) center/cover;border:3px solid var(--blue);box-shadow:0 6px 18px rgba(0,0,0,.5);
display:flex;align-items:center;justify-content:center;color:var(--tx);font-size:20px;font-weight:700;direction:rtl}
.pin.me{box-shadow:0 0 0 8px rgba(137,180,250,.18),0 6px 18px rgba(0,0,0,.5)}
.zlab{white-space:nowrap;padding:2px 9px;border-radius:99px;background:rgba(24,24,37,.92);color:var(--tx);font-size:12px;font-weight:500;line-height:20px;
display:inline-flex;align-items:center;gap:5px;direction:rtl;transform:translate(-50%,0)}
.zlab.home{color:var(--green);font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--blue)}

/* segmented control + map buttons */
.seg{position:absolute;z-index:2;top:16px;left:16px;right:16px;height:48px;padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;
background:var(--glass);border:1px solid var(--b1);border-radius:16px}
.seg button{display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:15px;font-weight:500;color:var(--tx)}
.seg button[aria-current]{background:var(--acc);color:#fff;font-weight:600}
.mbtns{position:absolute;z-index:2;left:16px;display:flex;flex-direction:column;gap:8px}
.mbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--b1);background:var(--glass);display:flex;align-items:center;justify-content:center}

/* bottom sheet (both) */
.sheet{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:12px 16px 24px;background:var(--card);border-top:1px solid var(--b1);border-radius:28px 28px 0 0;display:flex;flex-direction:column}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--b3)}
.shead{margin-top:14px;height:24px;display:flex;align-items:center;justify-content:space-between}
.shead h1{margin:0;font-size:17px;font-weight:600;line-height:24px}
.upd{font-size:13px;color:var(--mu)}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.prow{height:72px;width:100%;padding:0 12px;display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:20px}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--b1) center/cover;border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pname{font-size:16px;font-weight:600;line-height:22px}
.psub{font-size:13px;line-height:19px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bat{flex:none;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mu);direction:ltr}
.bat.low{color:var(--peach);font-weight:600}
.chev{color:var(--mu2)}

/* person */
.hero{position:relative;height:368px}
.panel{position:relative;z-index:1;margin-top:-28px;min-height:calc(100% - 340px);padding:22px 16px 24px;background:var(--bg);border-top:1px solid var(--b1);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:14px}
.prow1{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.pill{height:28px;padding:0 12px;border-radius:99px;background:rgba(137,180,250,.16);color:var(--blue);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.g{background:rgba(166,227,161,.16);color:var(--green)}
.hl{margin:0;font-size:36px;font-weight:300;line-height:44px;letter-spacing:-.5px}
.sub{margin-top:2px;font-size:14px;line-height:20px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{height:86px;padding:12px 14px;background:var(--card);border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tl{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:18px;color:var(--mu)}
.tv{display:flex;align-items:baseline;gap:6px;min-width:0}
.tv b{font-size:24px;font-weight:600;line-height:30px;font-variant-numeric:tabular-nums}
.tv span{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv.addr{font-size:15px;font-weight:500;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:3px;background:var(--b1);overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.bar.low i{background:var(--peach)}
.link{height:64px;width:100%;padding:0 14px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px}
.ibox{flex:none;width:40px;height:40px;border-radius:14px;background:rgba(137,180,250,.16);color:var(--blue);display:flex;align-items:center;justify-content:center}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column}
.ltxt b{font-size:15px;font-weight:600;line-height:21px}
.ltxt span{font-size:13px;line-height:19px;color:var(--mu)}

/* day timeline */
.day{padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:14px;background:var(--card);font-size:14px;white-space:nowrap}
.chip[aria-current]{background:var(--acc);color:#fff;font-weight:600}
.tot{height:76px;background:var(--card);border-radius:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center}
.tot div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tot div:nth-child(2){border-inline:1px solid var(--b1)}
.tot b{font-size:22px;font-weight:600;line-height:28px;font-variant-numeric:tabular-nums}
.tot b small{font-size:13px;font-weight:400;color:var(--mu);margin-inline-start:3px}
.tot span{font-size:12.5px;color:var(--mu)}
.tline{display:flex;flex-direction:column}
.trow{display:flex;gap:12px;width:100%}
.tt{flex:none;width:40px;padding-top:20px;font-size:12.5px;line-height:18px;color:var(--mu);font-variant-numeric:tabular-nums;text-align:start}
.rail{flex:none;width:14px;position:relative}
.rail::before{content:"";position:absolute;top:0;bottom:0;right:6px;width:2px;background:var(--b2)}
.trow.first .rail::before{top:26px}
.trow.last .rail::before{bottom:calc(100% - 26px)}
.rail i{position:absolute;top:22px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.rail i.h{background:var(--green)}
.rail i.now{box-shadow:0 0 0 4px rgba(166,227,161,.22)}
.rail i.u{background:var(--bg);border:2.5px solid var(--mu2)}
.tc{flex:1;min-width:0;margin:6px 0;padding:10px 14px;background:var(--card);border-radius:16px;border:1px solid transparent;display:flex;flex-direction:column;gap:2px}
.tc.now{border-color:rgba(166,227,161,.45)}
.tch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tch b{font-size:15px;font-weight:600;line-height:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npill{flex:none;height:24px;padding:0 10px;border-radius:99px;background:rgba(166,227,161,.16);color:var(--green);font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.tcs{font-size:13px;line-height:19px;color:var(--mu)}
.save{align-self:flex-start;margin-top:8px;height:44px;padding:0 12px;border:1px solid var(--b2);border-radius:12px;color:var(--blue);font-size:13px;font-weight:600}
.savef{margin-top:8px;display:flex;gap:8px}
.savef input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--b2);border-radius:12px;background:var(--bg);font-size:14px;outline:none}
.savef input:focus{border-color:var(--blue)}
.savef button{flex:none;height:44px;padding:0 14px;border-radius:12px;background:var(--acc);color:#fff;font-size:13px;font-weight:600}
.trow.mv .rail::before{width:0;background:none;border-right:2px dashed var(--b3);right:6px}
.mvt{flex:1;min-height:34px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.empty{padding:40px 16px;text-align:center;color:var(--mu);font-size:14px}

/* segment overlay */
.ov{position:fixed;inset:0;z-index:5;background:var(--bg)}
.ovbar{position:absolute;z-index:2;top:16px;left:16px;right:16px;min-height:48px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--b1);border-radius:16px}
.ovbar .ltxt b,.ovbar .ltxt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovx{flex:none;width:36px;height:36px;border-radius:12px;background:var(--b1);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app"><div class="msg">טוען…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="map_focus/core.js?v=8"></script>
<script src="map_focus/day.js?v=8"></script>
<script src="map_focus/now.js?v=8"></script>
<script src="map_focus/timeline.js?v=8"></script>
<script>MF.start();</script>
</body>
</html>
